# =========================
# Application
# =========================
spring.application.name=epms

# Always uses the real MySQL "epms" database on localhost (see below).

# =========================
# Server
# =========================
server.port=8080

# =========================
# Database
# =========================
# Credentials can be overridden without editing this file, e.g.
#   DB_URL=... DB_USERNAME=... DB_PASSWORD=... bash mvnw spring-boot:run
spring.datasource.url=jdbc:mysql://localhost:3306/epms
spring.datasource.username=root
spring.datasource.password=ASDfg56123##

# =========================
# Flyway
# =========================
# The base schema comes from docs/epms-schema.sql. Flyway then applies each
# epic's own changes on top (Epic 4 owns versions V400-V499). On a database
# that was created before Flyway was added, the first run records a baseline
# and then applies the pending migrations.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Each epic owns its own version range, so a lower-numbered migration from
# one epic can arrive after a higher one from another has been applied.
spring.flyway.out-of-order=true

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# Logging
# =========================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# =========================
# Uploads (book covers) — stored on disk, served at /uploads/**
# Fixed location under the user's home so IntelliJ, Maven and tests all
# read/write the same folder regardless of working directory.
# =========================
epms.uploads.dir=${user.home}/.readingplanet/uploads
# Upload ceiling for any single file; each feature checks its own lower limit
# (covers and receipts 5 MB, manuscripts 20 MB, print-ready PDFs 25 MB).
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# Private documents (manuscripts, designs, receipts): never served publicly,
# only downloaded through the authenticated API.
epms.documents.dir=${user.home}/.readingplanet/documents

# =========================
# E-mail (password reset, publishing application decisions)
# =========================
# Off unless configured. Set these as environment variables, never in this file:
#   SPRING_MAIL_HOST=smtp.gmail.com  SPRING_MAIL_PORT=587
#   SPRING_MAIL_USERNAME=...         SPRING_MAIL_PASSWORD=<app password>
# Without them, e-mails (including reset links) are written to the log instead.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
epms.mail.from=${MAIL_FROM:no-reply@readingplanet.lk}

# Base URL used in links inside e-mails
epms.app.base-url=${APP_BASE_URL:http://localhost:8080}

